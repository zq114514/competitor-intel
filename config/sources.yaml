# ============================================================
# 月报信息源配置（三类来源）
# ------------------------------------------------------------
# 说明：
# 1. category 取值：regulator=监管与认证 / oem=整车厂官方 / supplier=零部件供应商官方
#                  / industry=行业权威机构 / vertical_media=垂直汽车媒体
#    来源定位：官方/监管=定论依据；垂直媒体=线索发现、新车上市与参数库核对口径
# 2. url 为新闻列表页；若某源长期失效，可在下方 url 处更新，或注释掉
# 3. type: html（默认，通用新闻列表解析）| rss
# 4. verify_ssl: 该站点证书异常时可设为 false
# 5. enabled: false 可临时停用某源（采不到的源保留在册，由AI月度阶段WebSearch兜底）
# ============================================================

crawl:
  timeout: 20            # 单源请求超时（秒）
  lookback_days: 45      # 向前追溯天数（覆盖月初采集上月底发布的情形）
  max_items_per_source: 30
  workers: 8             # 并发数

# ---- 供 AI 月度生成阶段做 WebSearch 补充检索的关键词（脚本漏采时兜底）----
ai_search_fallback:
  - "工信部 新车公示 本月 公告 {year年month月}"
  - "免征车辆购置税 新能源汽车车型目录 {year年month月}"
  - "宁德时代 OR 蜂巢能源 OR 中创新航 OR 国轩高科 新技术 发布 {year年month月}"
  - "新车型上市 官方发布 {year年month月} 续航 电池"
  - "C-NCAP OR 中保研 碰撞测试结果 {year年month月}"
  - "华为车BU OR 博世 OR 采埃孚 智能底盘 发布 {year年month月}"
  - "800V OR 超充 OR 换电 新发布 {year年month月} 官方"

